name: Deploy gate

# evaluate -> gate -> deploy -> promote baseline.
#
# On a PR: build the model, evaluate it, and fail the check if any gated
# metric regressed against metrics/baseline.json (see model/gate.py).
# On main: the same gate again (so a direct push can't skip it), then
# ship the artifact, then ratchet the baseline forward.
#
# A deliberate regression is accepted by labelling the PR
# `accept-regression` (or running this workflow manually with
# accept_regression) - the gate then reports but doesn't block, and the
# baseline is reset to the new model's numbers on merge.

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so adding `accept-regression` re-runs the gate.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accept_regression:
        description: Ship and reset the baseline even if metrics regressed
        type: boolean
        default: false

concurrency:
  group: deploy-gate-${{ github.ref }}
  # Superseded PR pushes can be cancelled; runs on main must finish in
  # order so baseline commits never race each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: to post the gate's metric table as a PR comment.
      pull-requests: write
    outputs:
      allow_regression: ${{ steps.allow.outputs.allow }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('model/embeddings.py', 'model/rerank.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Check for an accepted regression
        id: allow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          DISPATCH_INPUT: ${{ inputs.accept_regression }}
        run: |
          case "$EVENT" in
            pull_request)
              allow=$(echo "$PR_LABELS" | jq 'any(.[]; . == "accept-regression")') ;;
            push)
              # The label lives on the PR, not the merge commit - look up
              # which PR this commit came from.
              allow=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq 'any(.[].labels[].name; . == "accept-regression")') ;;
            workflow_dispatch)
              allow="$DISPATCH_INPUT" ;;
          esac
          echo "allow=${allow:-false}" >> "$GITHUB_OUTPUT"
          echo "accept-regression: ${allow:-false}"

      - name: Train (build index artifact)
        run: python -m model.train

      - name: Evaluate
        run: python -m model.evaluate --out metrics/latest.json

      # The live baseline lives on the unprotected ml-baseline branch (see
      # promote-baseline). metrics/baseline.json on main is only the seed,
      # used before that branch exists and by local runs.
      - name: Fetch current baseline
        run: |
          if git fetch --depth=1 origin ml-baseline; then
            git show FETCH_HEAD:baseline.json > metrics/baseline.json
            echo "Baseline: ml-baseline branch"
          else
            echo "Baseline: seed metrics/baseline.json (no ml-baseline branch yet)"
          fi

      - name: Regression gate
        run: |
          python -m model.gate check --latest metrics/latest.json \
            --summary-out metrics/gate_summary.md \
            ${{ steps.allow.outputs.allow == 'true' && '--allow-regression' || '' }}

      # One sticky comment per PR: re-runs edit the bot's previous comment
      # rather than stacking a new one per push. continue-on-error because
      # PRs from forks get a read-only token and can't comment - the job
      # summary still has the same table.
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('metrics/gate_summary.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat metrics/gate_summary.md
            echo ""
            echo "<sub>Commit ${GITHUB_SHA::7} - [workflow run]($RUN_URL)</sub>"
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none

      # Uploaded even on failure so a red gate still leaves its numbers
      # behind to inspect.
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/latest.json
          if-no-files-found: ignore

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/

  deploy:
    needs: evaluate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: release/model

      - uses: actions/download-artifact@v4
        with:
          name: metrics
          path: release

      # Mock deploy: the release is the versioned, gate-approved bundle
      # (index + manifest + the metrics it passed with), kept as a
      # 90-day workflow artifact. A real target slots in here instead -
      # e.g. `aws s3 cp release/ s3://<bucket>/models/$GITHUB_SHA/
      # --recursive` then `aws lambda update-function-configuration` to
      # point the serving Lambda at it, as in emotisense/churnwatch.
      - name: Deploy (mock)
        run: |
          echo "Deploying model for $GITHUB_SHA"
          cat release/model/manifest.json
          {
            echo "## Deployed"
            echo ""
            echo "Commit \`$GITHUB_SHA\` - release artifact \`release-$GITHUB_SHA\`"
            echo ""
            echo '```json'
            cat release/latest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 90

  promote-baseline:
    needs: [evaluate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: metrics
          path: metrics

      - name: Fetch current baseline
        run: |
          if git fetch --depth=1 origin ml-baseline; then
            git show FETCH_HEAD:baseline.json > metrics/baseline.json
          fi

      # gate.py is stdlib-only, so no dependency install needed here.
      - name: Update baseline
        run: |
          python -m model.gate update-baseline --latest metrics/latest.json \
            ${{ needs.evaluate.outputs.allow_regression == 'true' && '--reset' || '' }}

      # Published to the ml-baseline branch, not main: main is protected
      # with the gate as a required check, and a GITHUB_TOKEN push can't
      # bypass that. Pushes made with GITHUB_TOKEN also don't trigger new
      # workflow runs, so this can't loop back into the gate.
      - name: Publish baseline
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin ml-baseline; then
            git worktree add -B ml-baseline ../ml-baseline FETCH_HEAD
          else
            git worktree add --orphan -b ml-baseline ../ml-baseline
          fi
          cp metrics/baseline.json ../ml-baseline/baseline.json
          cd ../ml-baseline
          git add baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged - nothing to publish."
            exit 0
          fi
          git commit -m "Baseline from ${GITHUB_SHA::7}"
          git push origin ml-baseline
